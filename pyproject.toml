[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studenthelper"
version = "0.1.0"
description = "A bilingual desktop assistant for student schedules and homework."
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.2",
    "playwright>=1.50.0",
    "google-generativeai>=0.8.4",
    "python-dotenv>=1.0.1",
    "Pillow>=11.0.0",
]

[project.scripts]
studenthelper = "studenthelper.app:main"

[tool.setuptools.packages.find]
where = ["src"]
