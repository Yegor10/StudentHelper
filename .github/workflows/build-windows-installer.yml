name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application and build dependencies
        run: python -m pip install -e ".[build]"
      - name: Build Windows executable
        run: python -m PyInstaller --clean --noconfirm installer\studenthelper.spec
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build setup installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw "Inno Setup compiler not found." }
          & $compiler installer\studenthelper.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed." }
      - uses: actions/upload-artifact@v4
        with:
          name: StudentHelper-Windows-Setup
          path: dist/installer/StudentHelper-Setup-*.exe
          if-no-files-found: error
